<script>

  { zonk: "music5.mp3", blargh: 20 },
  { zonk: "music6.mp3", blargh: 4 }
];
var wibble = 0;
var glorp = 1;

var boop = new Audio(fizzlewump[0].zonk);
boop.currentTime = 22;
boop.volume = 0;

function snagglePick() {
  var noodles = [];
  for (var q = 1; q < fizzlewump.length; q++) {
    if (q != wibble) noodles.push(q);
  }
  if (noodles.length == 0) return fizzlewump.length > 1 ? wibble : 0;

  for (var flop = 0; flop < 100000; flop++) {
    var plonked = noodles.filter(function (q) {
      return Math.random() * 100 < fizzlewump[q].blargh;
    });
    if (plonked.length) return plonked[Math.floor(Math.random() * plonked.length)];
  }
  return noodles[0];
}

function swapBoop() {
  wibble = snagglePick();
  boop.volume = 0;
  boop.src = fizzlewump[wibble].zonk;
  boop.currentTime = wibble == 0 ? 22 : 0;
  boop.play();
}
boop.addEventListener("ended", swapBoop);
wiggler.addEventListener("click", swapBoop);

setInterval(function () {
  if (!boop.duration) return;
  var zib = wibble == 0 ? 22 : 0;
  var zab = wibble == 0 ? 0.5 : 2;
  var zub = Math.min(1, (boop.currentTime - zib) / zab, (boop.duration - boop.currentTime) / 2);
  boop.volume = Math.max(0, glorp * zub);
}, 50);

gnorp.addEventListener("click", function () {
  gnorp.remove();
  boop.play();
  setTimeout(blurtLetters, 300);
});

function blurtLetters() {

    flibber.textContent += chunks[k];
    k++;

      setTimeout(kaboinkle, 170);
    }
  }, 150);
}

function kaboinkle() {
  kablorp.style.opacity = 1;
  splunge.remove();
  document.body.style.overflow = "auto";
  setTimeout(function () {
    kablorp.style.transition = "opacity 2.5s";
    kablorp.style.opacity = 0;

  shhhhh();
}

function shhhhh() {
  var tock = setInterval(function () {
    glorp = Math.max(0.6, glorp - 0.02);

var zorbDay = new Date("2029-09-24T20:22:18Z").getTime();
function tickyTonk() {
  var grab = getSelection();
  var grabbed = shhhmoo.contains(grab.anchorNode) || shhhmoo.contains(grab.focusNode);

    Math.floor(bleep / 86400) + " days; " +
    Math.floor(bleep % 86400 / 3600) + " hours; " +
    Math.floor(bleep % 3600 / 60) + " minutes; " +
    bleep % 60 + " seconds left)";
  if (grabbed) grab.selectAllChildren(shhhmoo);
}
tickyTonk();
setInterval(tickyTonk, 1000);
